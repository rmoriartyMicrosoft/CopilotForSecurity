openapi: 3.0.0
info:
  title: MD5 Hash Lookup API (BrokerNitrix)
  version: "1.0"
servers:
  - url: https://prod-34.eastus.logic.azure.com:443
paths:
  /workflows/4223edf9f15149e49beb5a746747cf88/triggers/When_a_HTTP_request_is_received/paths/invoke:
    post:
      operationId: MD5HashBroker
      summary: Retrieves the original value of a given MD5 hash (BrokerNitrix)
      description: Triggers the specified Logic App workflow.
      parameters:
        - name: api-version
          in: query
          required: true
          schema:
            type: string
            default: "2016-10-01"
        - name: sp
          in: query
          required: true
          schema:
            type: string
            default: "/triggers/When_a_HTTP_request_is_received/run"
        - name: sv
          in: query
          required: true
          schema:
            type: string
            default: "1.0"
        - name: sig
          in: query
          required: true
          schema:
            type: string
            default: "_cXYCIkbO9jwpmOTqFzWhJkPE7ix3nVxhDMF6uBlhYE"
      requestBody:
        description: The MD5 hash to look up
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                MD5:
                  type: string
      responses:
        "200":
          description: Information about the hash, whether found or not.
